          description: Markdown supported.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedIdea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
          description: The idea.
        source:
          type: string
          description: Where you heard it / what you were doing when the idea came.
          maxLength: 500
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedLog:
