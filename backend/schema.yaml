components:
  schemas:
    CheckinItem:
      type: object
      description: One active question paired with its answer for a given date (if
        any).
      properties:
        question_id:
          type: integer
        text:
          type: string
        order:
          type: integer
        answer_id:
          type: integer
          nullable: true
        answer:
          type: string
      required:
      - answer
      - answer_id
      - order
      - question_id
      - text
    ColorEnum:
      enum:
      - red
      - orange
      - amber
      - yellow
      - lime
      - green
      - emerald
      - teal
      - cyan
      - sky
      - blue
      - indigo
      - violet
      - purple
      - fuchsia
      - pink
      - rose
      - slate
      - gray
      - zinc
      - neutral
      - stone
      type: string
      description: |-
        * `red` - Red
        * `orange` - Orange
        * `amber` - Amber
        * `yellow` - Yellow
        * `lime` - Lime
        * `green` - Green
        * `emerald` - Emerald
        * `teal` - Teal
        * `cyan` - Cyan
        * `sky` - Sky
        * `blue` - Blue
        * `indigo` - Indigo
        * `violet` - Violet
        * `purple` - Purple
        * `fuchsia` - Fuchsia
        * `pink` - Pink
        * `rose` - Rose
        * `slate` - Slate
        * `gray` - Gray
        * `zinc` - Zinc
        * `neutral` - Neutral
        * `stone` - Stone
    Completion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date_completed:
          type: string
          format: date
        day_of_week:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        streak:
          type: integer
      required:
      - date_completed
      - id
      - streak
    DailyAnswer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: integer
        question_text:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        answer:
          type: string
          description: Markdown supported.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - question
      - question_text
      - updated_at
    Idea:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
          description: The idea.
        source:
          type: string
          description: Where you heard it / what you were doing when the idea came.
          maxLength: 500
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - id
      - source
      - updated_at
    Log:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        body:
          type: string
          description: Markdown supported.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - id
      - updated_at
    PatchedCompletion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date_completed:
          type: string
          format: date
        day_of_week:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        streak:
          type: integer
    PatchedDailyAnswer:
      type: object
